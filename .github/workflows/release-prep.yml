name: Release Prep

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'ci: finalize release prep') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Repair Go TUI source and CI linter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/cli/tui/professional.go')
          s = p.read_text()
          old = 'for i,c:=range commands { line=fmt.Sprintf'
          new = 'for i,c:=range commands { line:=fmt.Sprintf'
          if old not in s:
              raise SystemExit('professional.go target already fixed or changed')
          p.write_text(s.replace(old, new, 1))

          compat = Path('packages/cli/tui/compile_compat.go')
          if compat.exists():
              compat.unlink()

          ci = Path('.github/workflows/ci.yml')
          s = ci.read_text()
          old_ci = 'https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0'
          new_ci = 'https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2'
          if old_ci not in s:
              raise SystemExit('CI golangci-lint install command was not found')
          ci.write_text(s.replace(old_ci, new_ci, 1))
          PY

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit final release-prep fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-prep.yml
          git add -- packages/cli/tui/professional.go .github/workflows/ci.yml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No release-prep changes were produced.'
            exit 0
          fi
          git commit -m 'ci: finalize release prep'
          git push
